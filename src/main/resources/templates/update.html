<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>勤怠連絡システム</title>
<link th:href="@{/css/style.css}" rel="stylesheet">
<link rel="stylesheet" th:href="@{../static/css/detail_regist.css}" />
</head>
<body>
  <div th:replace="header :: header"></div>

  <main class="page">
    <h2 class="section-title">更新</h2>

    <form th:object="${updateModel}" class="form">
      <input type="hidden" th:field="*{lateId}" />

      <label for="date">日付</label>
      <input id="date" type="date" class="input" th:field="*{date}" />
      <div></div>

      <label for="empName">社員名</label>
      <select id="empName" class="input" th:field="*{empId}" th:disabled="${disableEmpSelect}">
        <option value="">選択してください</option>
        <option th:each="emp : ${employeeList}"
          th:value="${emp.empId}"
          th:text="${emp.empLeame} + ' ' + ${emp.empFname}"></option>
      </select>
      <div></div>

      <label for="lateReason">遅刻理由</label>
      <select id="lateReason" class="input" th:field="*{lateReason}">
        <option value="">選択してください</option>
        <option value="1">電車遅延</option>
        <option value="2">体調不良</option>
        <option value="3">その他</option>
      </select>
      <div></div>

      <label for="line">路線名</label>
      <select id="line" class="input" th:field="*{trainId}">
        <option value="">選択してください</option>
        <option th:each="trainJson : ${session.trains}"
          th:value="${trainJson.trainId}" th:text="${trainJson.trainName}"></option>
      </select>
      <div></div>

      <label for="delay-min">遅延時間</label>
      <input id="delay-min" type="number" class="input" inputmode="numeric"
        th:field="*{trainDelayMinutes}" th:disabled="*{lateReason !='1'}" />分
      <br>

      <label for="start-time">始業時間</label>
      <input id="start-time" type="time" class="input" th:field="*{startTime}" />
      <br>

      <label for="note">備考</label>
      <textarea id="note" class="input" placeholder="備考を入力" th:field="*{note}"></textarea>
      <div></div>

      <div class="actions single" style="grid-column: 1/-1; margin-top: 8px;">
        <button type="button" class="btn">更新</button>
      </div>
    </form>
  </main>

  <script>
    (function () {
      const lateReason = document.getElementById('lateReason');
      const line = document.getElementById('line');
      const delayMin = document.getElementById('delay-min');

      function applyEnableState() {
        const isTrainDelay = lateReason.value === '1';
        line.disabled = !isTrainDelay;
        delayMin.disabled = !isTrainDelay;
        if (!isTrainDelay) {
          line.value = '';
          delayMin.value = '';
        }
      }

      lateReason.addEventListener('change', applyEnableState);
      applyEnableState();
    })();
  </script>
</body>
</html>
